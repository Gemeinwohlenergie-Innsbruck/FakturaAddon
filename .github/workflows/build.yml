name: Build Windows EXE

on:
  push:
    tags:
      - "v*"          # triggers on tags like v1.0.0, v1.2.3

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # ← required to create GitHub releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # Catches a dependency that is imported but missing from requirements.txt,
      # which would otherwise ship as an EXE that dies before the window appears.
      - name: Smoke test imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import main; print('all imports resolved')"

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Build EXE
        run: >
          pyinstaller
          --onedir
          --windowed
          --name "EEGApp"
          --add-data "templates/email_template_clean.html;templates"
          --add-data "templates/template_invoice_clean.docx;templates"
          --add-data "assets/gei_logo.png;assets"
          main.py

      - name: Copy templates next to EXE
        run: |
          copy templates\email_template_clean.html dist\EEGApp\
          copy templates\template_invoice_clean.docx dist\EEGApp\

      - name: Zip release folder
        run: |
          cd dist
          Compress-Archive -Path EEGApp -DestinationPath EEGApp-windows.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EEGApp-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}